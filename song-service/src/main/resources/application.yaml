server:
  port: 8082

spring:
  application:
    name: song-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# Eureka client. Each replica registers under the shared name "song-service".
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    # How often this client refreshes its local copy of the registry (default 30s).
    registry-fetch-interval-seconds: 5
  instance:
    # Local default: register as "localhost" (reachable via loopback on ANY network).
    # In Docker, compose sets EUREKA_PREFER_IP_ADDRESS=true so each replica registers
    # its own compose-network IP, so the two replicas are distinct, reachable instances.
    # The default instanceId is derived from spring.cloud.client.hostname (the container
    # id in Docker), so the replicas keep distinct instance ids regardless of hostname.
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    # How often this instance sends heartbeats to the server (default 30s).
    lease-renewal-interval-in-seconds: 5
